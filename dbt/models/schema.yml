version: 2

models:
  - name: stg_customers
    description: "Staging view for cleaned raw customer data."
    columns:
      - name: customer_id
        description: "Primary key for customer."
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address."
        data_tests:
          - not_null

  - name: dim_customers
    description: "Dimension table containing consolidated customer profiles."
    columns:
      - name: customer_id
        description: "Primary key for customer dimension."
        data_tests:
          - unique
          - not_null
      - name: email
        description: "Customer email address."
        data_tests:
          - not_null

