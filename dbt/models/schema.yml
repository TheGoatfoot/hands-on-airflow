version: 2

models:
  - name: openmeteo_weather
    description: "Bronze staging view extracting and cleaning raw Open-Meteo Historical Weather observations."
    columns:
      - name: city
        description: "Monitored city name."
        data_tests:
          - not_null
      - name: observation_date
        description: "Date of the weather observation."
        data_tests:
          - not_null
      - name: temperature_2m_mean_c
        description: "Mean daily temperature at 2 meters above ground in Celsius."
        data_tests:
          - not_null

  - name: dim_cities
    description: "Conformed dimension table for weather-monitored cities (Silver Layer). Grain: One row per city."
    columns:
      - name: city_sk
        description: "Surrogate key for city (MD5 hash of lowercase trimmed city name)."
        data_tests:
          - unique
          - not_null
      - name: city
        description: "Natural key of the city."
        data_tests:
          - unique
          - not_null
      - name: latitude
        description: "Latitude coordinate of the city."
        data_tests:
          - not_null
      - name: longitude
        description: "Longitude coordinate of the city."
        data_tests:
          - not_null

  - name: fct_openmeteo_daily_weather
    description: "Daily weather observations fact table from Open-Meteo (Silver Layer). Grain: One row per city per observation date."
    columns:
      - name: weather_observation_sk
        description: "Surrogate key for observation (MD5 hash of city and observation_date)."
        data_tests:
          - unique
          - not_null
      - name: city_sk
        description: "Foreign key referencing dim_cities."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_cities')
              field: city_sk
      - name: observation_date
        description: "Date of the weather observation."
        data_tests:
          - not_null
      - name: temperature_2m_mean_c
        description: "Mean daily temperature at 2 meters above ground in Celsius."
        data_tests:
          - not_null
